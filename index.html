<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover">
 <!-- 기본 미리보기. 링크마다 다른 미리보기는 로봇만 서버 /preview로 넘겨 낸다 (vercel.json, 경로 1 리뷰 N2) -->
 <meta property="og:title" content="매치 — 친구가 불렀어요" />
 <meta property="og:description" content="무엇이든 정식 대결로. 한 판 붙고 기록을 남겨요" />
 <meta property="og:image" content="https://matchapp.me/og-image.png" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"> <!-- or black -->

  <!-- 서체: 라틴·숫자는 Geist, 한글은 Pretendard (숫자는 표 숫자로) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- 글꼴 CSS는 main.js가 첫 화면을 그린 뒤 붙인다: 여기서 받으면 글꼴 파일 여덟이 본체 JS와 회선을 나눠 느린 폰에서 첫 화면이 1초 넘게 늦었다 (11/11 몸과 시간) -->

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <!-- 홈 화면에 추가(PWA): 앱스토어 전까지 웹으로 들어온 사람이 앱처럼 다시 연다 -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="매치">
  <!-- 기본은 다크. 라이트를 고른 사람은 아래 스크립트가 바꾼다 (src/utils/theme.js와 같은 값) -->
  <meta name="theme-color" content="#09090b">
  <!-- 탭·홈 화면 이름은 한글 앱 이름으로 (경로 1 리뷰 N14) -->
  <title>매치</title>

  <script>
    // 화면 모드(설정 > 화면). 첫 화면을 그리기 전에 적용해 깜빡이지 않게
    try { if (localStorage.getItem('match_theme') === 'light') { document.documentElement.dataset.theme = 'light'; document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f7f7f5') } } catch (e) {}
    // 터치 기반 확대(핀치줌, 더블탭) 완전 차단
    document.addEventListener('gesturestart', function (e) {
      e.preventDefault();
    });
    document.addEventListener('gesturechange', function (e) {
      e.preventDefault();
    });
    document.addEventListener('gestureend', function (e) {
      e.preventDefault();
    });


    let initialVh = window.innerHeight * 0.01
    document.documentElement.style.setProperty('--real-vh', `${initialVh}px`)

    window.addEventListener('setRealVh', (e) => {
      document.documentElement.style.setProperty('--real-vh', `${e.detail}px`);
      // 필요하면: document.body.style.height = `${e.detail}px`
    });
    
    const ua = navigator.userAgent.toLowerCase()
    if (ua.includes('raspy-ios')) {
      document.documentElement.classList.add('ios-app')
    }
  </script>
  <style>
    html {
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
a {
  -webkit-user-select: none;
}
    .ios-app .raspy-top {
      padding-top: 0Px;
    }

    .ios-app body {
      padding-top: 0px;
    }

    .ios-app .raspy-bot {
      padding-bottom: 0px;
    }

    .ios-app .raspy-total-top{
      padding-top: 71px;
    }

    html, body {
      overscroll-behavior: none;
      /* 최신 브라우저용 */
      margin: 0;
      /* 앱 전체 바탕(--c-canvas). 글자 기본색도 맞춘다 */
      background-color: rgb(var(--c-canvas));
      color: rgb(var(--c-fg));
      height: 100%;
    }

    body {
      user-select: none;
      -webkit-user-select: none;
      -ms-user-select: none;
    }
  </style>
</head>

<body>
  <noscript>
    <strong>Match는 JavaScript가 켜져 있어야 동작해요.
    </strong>
  </noscript>
  <div id="app" class="h-full">
    <!-- 앱이 뜨면 바뀐다. 자바스크립트 없이 읽는 심사 봇용: 앱 이름과 처리방침 링크 -->
    <p style="padding:16px">Match — 규칙을 고르고, 한 판 붙고, 기록을 남겨요. <a href="/privacy">개인정보 처리방침</a> · <a href="/terms">이용약관</a></p>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
