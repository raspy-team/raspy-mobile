<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover">
 <meta property="og:title" content="Match 경기에 초대되었어요!" />
 <meta property="og:description" content="클릭하여 Match 앱에서 확인해보세요." />
 <meta property="og:image" content="https://raspy-mobile.vercel.app/og-image.png" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"> <!-- or black -->

  <!-- 서체: 라틴·숫자는 Geist, 한글은 Pretendard, 숫자·기록은 Geist Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="/favicon.ico">
  <meta name="theme-color" content="#0a0a0b">
  <title>
    Match
  </title>

  <script>
    // 터치 기반 확대(핀치줌, 더블탭) 완전 차단
    document.addEventListener('gesturestart', function (e) {
      e.preventDefault();
    });
    document.addEventListener('gesturechange', function (e) {
      e.preventDefault();
    });
    document.addEventListener('gestureend', function (e) {
      e.preventDefault();
    });


    let initialVh = window.innerHeight * 0.01
    document.documentElement.style.setProperty('--real-vh', `${initialVh}px`)

    window.addEventListener('setRealVh', (e) => {
      document.documentElement.style.setProperty('--real-vh', `${e.detail}px`);
      // 필요하면: document.body.style.height = `${e.detail}px`
    });
    
    const ua = navigator.userAgent.toLowerCase()
    if (ua.includes('raspy-ios')) {
      document.documentElement.classList.add('ios-app')
    }
  </script>
  <style>
    html {
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
a {
  -webkit-user-select: none;
}
    .ios-app .raspy-top {
      padding-top: 0Px;
    }

    .ios-app body {
      padding-top: 0px;
    }

    .ios-app .raspy-bot {
      padding-bottom: 0px;
    }

    .ios-app .raspy-total-top{
      padding-top: 71px;
    }

    html, body {
      overscroll-behavior: none;
      /* 최신 브라우저용 */
      margin: 0;
      /* 앱 전체가 검은 바탕. 글자 기본색도 맞춘다 */
      background-color: #0a0a0b;
      color: #ededef;
      height: 100%;
    }

    body {
      user-select: none;
      -webkit-user-select: none;
      -ms-user-select: none;
    }
  </style>
</head>

<body>
  <noscript>
    <strong>Match는 JavaScript가 켜져 있어야 동작해요.
    </strong>
  </noscript>
  <div id="app" class="h-full"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
